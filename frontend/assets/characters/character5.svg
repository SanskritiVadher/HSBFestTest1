  <ellipse cx="70" cy="102" rx="24" ry="28" fill="#8DB580"/>
  <!-- Belly -->
  <ellipse cx="74" cy="106" rx="14" ry="18" fill="#FBF6EA"/>
  <!-- Head -->
  <circle cx="74" cy="64" r="20" fill="#8DB580"/>
  <ellipse cx="82" cy="68" rx="10" ry="7" fill="#8DB580"/>
  <circle cx="72" cy="60" r="3" fill="#2B2A28"/>
  <circle cx="73" cy="59" r="1" fill="#ffffff" stroke="none"/>
