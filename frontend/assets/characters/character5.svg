  <polygon points="132,46 136,56 146,58 138,66 141,76 132,70 123,76 126,66 118,58 128,56" fill="#F2B84B" stroke="#2B2A28" stroke-width="2.5"/>
  <circle cx="116" cy="44" r="2" fill="#E5533D" stroke="none"/>
  <circle cx="146" cy="85" r="2" fill="#E5533D" stroke="none"/>
