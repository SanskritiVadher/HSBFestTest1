<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none" stroke="#2B2A28" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Cheerful chubby penguin on a skateboard line-art doodle -->
  <!-- Penguin Body Outer -->
  <path d="M50,85 C50,45 60,35 80,35 C100,35 110,45 110,85 C110,115 102,126 80,126 C58,126 50,115 50,85 Z" fill="#2B2A28"/>
  <!-- White Chubby Belly -->
  <ellipse cx="80" cy="85" rx="19" ry="26" fill="#FBF6EA"/>
  <!-- Happy Eyes -->
  <path d="M70,52 Q74,48 78,52" stroke-width="2.5"/>
  <path d="M82,52 Q86,48 90,52" stroke-width="2.5"/>
  <!-- Orange Beak -->
  <polygon points="75,56 85,56 80,63" fill="#F08A3C"/>
  <!-- Rosy Cheeks -->
  <ellipse cx="68" cy="58" rx="3.5" ry="2" fill="#F28B82"/>
  <ellipse cx="92" cy="58" rx="3.5" ry="2" fill="#F28B82"/>
  <!-- Flippers outstretched for balance -->
  <path d="M50,75 Q32,82 40,94" fill="#2B2A28"/>
  <path d="M110,75 Q128,82 120,94" fill="#2B2A28"/>
  <!-- Feet -->
  <ellipse cx="70" cy="126" rx="8" ry="4" fill="#F08A3C"/>
  <ellipse cx="90" cy="126" rx="8" ry="4" fill="#F08A3C"/>
  <!-- Skateboard Deck -->
  <rect x="42" y="130" width="76" height="8" rx="4" fill="#8DB580" transform="rotate(-3 80 134)"/>
  <!-- Skateboard Wheels -->
  <circle cx="56" cy="144" r="5" fill="#E5533D"/>
  <circle cx="104" cy="141" r="5" fill="#E5533D"/>
  <!-- Motion Swoosh -->
  <path d="M30,136 L38,136 M24,142 L34,142" stroke-dasharray="2 3"/>
</svg>
