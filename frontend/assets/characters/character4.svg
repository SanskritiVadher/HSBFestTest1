<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 170" width="100%" height="100%" fill="none" stroke="#2B2A28" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Cheerful chubby Penguin on Skateboard -->
  <!-- Penguin Outer Body -->
  <path d="M52,90 C52,48 64,36 85,36 C106,36 118,48 118,90 C118,122 108,132 85,132 C62,132 52,122 52,90 Z" fill="#2B2A28"/>
  <!-- Chubby White Belly -->
  <ellipse cx="85" cy="92" rx="22" ry="28" fill="#FBF6EA"/>
  <!-- Happy Expressive Eyes -->
  <path d="M74,56 Q78,51 82,56" stroke-width="3"/>
  <path d="M88,56 Q92,51 96,56" stroke-width="3"/>
  <!-- Orange Beak -->
  <polygon points="80,60 90,60 85,68" fill="#F08A3C"/>
  <!-- Rosy Cheeks -->
  <ellipse cx="71" cy="63" rx="4" ry="2.5" fill="#F28B82" stroke="none"/>
  <ellipse cx="99" cy="63" rx="4" ry="2.5" fill="#F28B82" stroke="none"/>
  <!-- Flippers Outstretched for Balance -->
  <path d="M52,82 Q32,88 40,102" fill="#2B2A28"/>
  <path d="M118,82 Q138,88 130,102" fill="#2B2A28"/>
  <!-- Orange Feet -->
  <ellipse cx="74" cy="132" rx="9" ry="5" fill="#F08A3C"/>
  <ellipse cx="96" cy="132" rx="9" ry="5" fill="#F08A3C"/>
  <!-- Curved Skateboard Deck -->
  <rect x="44" y="138" width="82" height="9" rx="4.5" fill="#8DB580" transform="rotate(-3 85 142)"/>
  <!-- Big Red Wheels -->
  <circle cx="60" cy="154" r="6.5" fill="#E5533D"/>
  <circle cx="112" cy="151" r="6.5" fill="#E5533D"/>
  <!-- Motion speed dashes -->
  <path d="M30,144 L40,144 M24,150 L36,150" stroke="#E5533D" stroke-width="2.5" stroke-dasharray="3 3"/>
</svg>
