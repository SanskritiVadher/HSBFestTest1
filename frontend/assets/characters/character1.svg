<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none" stroke="#2B2A28" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Scheming Cat chasing clever tiny Mouse -->
  <!-- Cat Body -->
  <path d="M45,120 Q55,75 95,85 Q120,90 125,125 Q105,142 55,136 Z" fill="#D9A58F"/>
  <!-- Cat Ears -->
  <polygon points="56,80 46,50 70,68" fill="#F28B82"/>
  <polygon points="76,69 88,48 95,73" fill="#F28B82"/>
  <!-- Big Scheming Cartoon Eyes -->
  <ellipse cx="64" cy="85" rx="5" ry="7" fill="#FBF6EA" stroke="#2B2A28" stroke-width="2.5"/>
  <circle cx="66" cy="85" r="3" fill="#2B2A28"/>
  <ellipse cx="82" cy="83" rx="5" ry="7" fill="#FBF6EA" stroke="#2B2A28" stroke-width="2.5"/>
  <circle cx="84" cy="83" r="3" fill="#2B2A28"/>
  <!-- Cat Nose & Sly Smile -->
  <polygon points="72,92 76,92 74,95" fill="#E5533D"/>
  <path d="M68,98 Q74,103 80,97 Q86,101 92,96" stroke-width="2.5"/>
  <!-- Whiskers -->
  <path d="M48,88 L32,84 M48,93 L30,94 M88,88 L104,84 M88,93 L106,95" stroke-width="2"/>
  <!-- Outstretched Front Paws -->
  <ellipse cx="122" cy="126" rx="16" ry="7" fill="#D9A58F" transform="rotate(-10 122 126)"/>
  <ellipse cx="88" cy="138" rx="14" ry="7" fill="#D9A58F"/>
  <!-- Arched Long Tail -->
  <path d="M45,125 Q20,115 16,85 Q20,65 34,72" stroke-width="3.5" fill="none"/>

  <!-- Dashed Chase Path -->
  <path d="M140,140 Q160,145 185,138" stroke="#E5533D" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Clever Mouse Zooming -->
  <ellipse cx="195" cy="132" rx="16" ry="11" fill="#F2B84B"/>
  <!-- Mouse Ear -->
  <circle cx="186" cy="122" r="7" fill="#F28B82"/>
  <!-- Mouse Eye -->
  <circle cx="204" cy="130" r="2.5" fill="#2B2A28"/>
  <circle cx="209" cy="133" r="1.5" fill="#E5533D"/>
  <!-- Mouse Tail & Dash lines -->
  <path d="M180,132 Q166,128 170,120" stroke-width="2.5"/>
  <path d="M148,150 L160,150 M154,155 L168,155" stroke="#2B2A28" stroke-width="2" stroke-dasharray="2 3"/>
</svg>
